name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  smoke:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot the app and hit /health
        run: |
          python - <<'EOF'
          from app import app
          client = app.test_client()
          resp = client.get("/health")
          assert resp.status_code == 200, resp.status_code
          body = resp.get_json()
          assert body["service"] == "pro-flight-tracker"
          assert "upstreams" in body and "breakers" in body
          routes = sorted(
              r.rule for r in app.url_map.iter_rules()
              if r.rule.startswith("/api/"))
          assert len(routes) == 33, f"expected 33 /api routes, got {len(routes)}"
          print(f"smoke ok: /health 200, {len(routes)} /api routes")
          EOF
